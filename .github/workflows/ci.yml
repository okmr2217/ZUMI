name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Cloudflare/D1/Sentry のシークレットが未設定でもビルドが通るよう
          # プレースホルダーを渡す。実配信に関わる値は Secrets 経由で別途注入する。
          NEXT_PUBLIC_SENTRY_DSN: ""
          SENTRY_DSN: ""

name: Deploy

# main への push で走る CI（ci.yml）が、全ジョブ（lint-typecheck-build・e2e）とも成功したときだけ
# デプロイする。CI が失敗・キャンセル（後続の push で打ち切られた場合を含む）なら出さない。
# workflow_run は既定ブランチ（main）にあるこのファイルの定義で動くため、変更は main に入ってから効く。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # 手動デプロイ（CI を待たずに出す）。main 以外のブランチを選んでもジョブは動かない
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-notify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      # workflow_run では CI が検証したコミットを出す（既定の checkout は main の最新になるため）
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy zumi-notify
        working-directory: apps/notify
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      # workflow_run では CI が検証したコミットを出す（既定の checkout は main の最新になるため）
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (OpenNext for Cloudflare)
        working-directory: apps/web
        run: npx opennextjs-cloudflare build
        env:
          # NEXT_PUBLIC_* はビルド時にクライアントバンドルへ埋め込まれるため、
          # デプロイ時ではなくビルド時にここで渡す必要がある。
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          # Sentry の environment（wrangler.toml の [vars] と同じ値にする）
          NEXT_PUBLIC_APP_ENV: production
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # ソースマップアップロードは next build (Sentry webpack plugin) が
          # 行うため、デプロイ時ではなくビルド時にここで渡す必要がある
          # (未設定時は next.config.ts の disable フォールバックで通る)。
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Deploy zumi-web
        working-directory: apps/web
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
